<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="serp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Terminal Card -->
  <rect x="8" y="14" width="84" height="72" rx="16" fill="url(#serp-grad)" />
  
  <!-- Window Header Bar / Dots -->
  <circle cx="22" cy="26" r="3" fill="#FDA4AF" />
  <circle cx="31" cy="26" r="3" fill="#FDE047" />
  <circle cx="40" cy="26" r="3" fill="#86EFAC" />
  
  <!-- Inner Terminal Display -->
  <rect x="14" y="36" width="72" height="44" rx="8" fill="#0F172A" />
  
  <!-- Code Prompt / Search Bracket Graphic -->
  <path d="M26 48L34 54L26 60" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="39" y1="60" x2="49" y2="60" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Search Radar Accent (Mini Lens) -->
  <circle cx="64" cy="54" r="8" stroke="url(#accent-grad)" stroke-width="2.5" />
  <line x1="70" y1="60" x2="76" y2="66" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
